# Every push to main: run the tests, then deploy to Cloudflare. The phones reload themselves afterwards.
# One-time setup (secrets) is described in README.md, section "Automatic deploy".
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare local test environment
        run: |
          npm run setup:local
          echo "PUSH_TEST_URL=http://127.0.0.1:9911" >> .dev.vars
      - name: Start the local worker
        run: |
          nohup npx wrangler dev --local --test-scheduled --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8787/ && exit 0; sleep 1; done
          cat wrangler.log; exit 1
      - run: npm test
      - name: Worker log (on failure)
        if: failure()
        run: cat wrangler.log

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy
        run: node scripts/deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FREIGANG_EMAIL: ${{ secrets.FREIGANG_EMAIL }}
